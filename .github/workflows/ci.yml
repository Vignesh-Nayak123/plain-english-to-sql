name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package (core only, no torch)
        # the core library (prompts, exec_eval) is pure-python; install without
        # heavy deps so CI stays fast and GPU-free.
        run: pip install -e . --no-deps

      - name: Run core tests (schema parsing + execution grader)
        run: python tests/test_core.py
